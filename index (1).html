<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagram</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #000000;
    --muted: #737373;
    --line: #dbdbdb;
    --blue: #0095f6;
    --red: #ed4956;
    --chip: #efefef;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #000000; --text: #f5f5f5;
      --muted: #a8a8a8; --line: #262626; --chip: #262626;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #000000; --text: #f5f5f5;
    --muted: #a8a8a8; --line: #262626; --chip: #262626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    position: fixed; inset: 0 auto 0 0;
    width: 245px; padding: 8px 12px 20px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    background: var(--bg);
  }
  .logo {
    font-family: "Billabong", "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    font-size: 30px; font-weight: 600; letter-spacing: .5px;
    padding: 28px 12px 24px;
  }
  .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .nav a, .nav button {
    display: flex; align-items: center; gap: 16px;
    padding: 12px; border-radius: 8px; font-size: 16px; text-align: left; width: 100%;
  }
  .nav a:hover, .nav button:hover { background: var(--chip); }
  .nav .active { font-weight: 700; }
  .avatar-sm { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,#feda75,#d62976,#4f5bd5); }

  /* Main */
  .main { margin-left: 245px; flex: 1; display: flex; justify-content: center; gap: 64px; padding: 24px 24px 80px; }
  .feed { width: 100%; max-width: 470px; }

  /* Suggestions column */
  .side { width: 319px; padding-top: 16px; }
  .me { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .me .pic { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#a1c4fd,#c2e9fb); display:grid; place-items:center; font-size: 20px; }
  .me b { display: block; font-size: 14px; }
  .me span { color: var(--muted); }
  .me .switch { margin-left: auto; color: var(--blue); font-weight: 600; font-size: 12px; }
  .side h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 8px 0 12px; display: flex; justify-content: space-between; }
  .side h3 a { color: var(--text); font-size: 12px; }
  .sug { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .sug .pic { width: 36px; height: 36px; border-radius: 50%; display:grid; place-items:center; font-size: 17px; }
  .sug .who b { display:block; font-size: 14px; }
  .sug .who span { color: var(--muted); font-size: 12px; }
  .sug .follow { margin-left: auto; color: var(--blue); font-weight: 600; font-size: 12px; }
  .sug .follow.on { color: var(--muted); }
  .side footer { color: #c7c7c7; font-size: 12px; margin-top: 28px; line-height: 1.8; }

  /* Stories */
  .stories {
    display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px;
    scrollbar-width: none; margin-bottom: 8px;
  }
  .stories::-webkit-scrollbar { display: none; }
  .story { flex: 0 0 auto; width: 66px; text-align: center; }
  .ring {
    width: 66px; height: 66px; border-radius: 50%; padding: 3px;
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    display: grid; place-items: center;
  }
  .ring.seen { background: var(--line); }
  .ring .inner {
    width: 100%; height: 100%; border-radius: 50%;
    border: 3px solid var(--bg);
    display: grid; place-items: center; font-size: 26px;
  }
  .story small { display: block; margin-top: 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Post */
  .post { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
  .post-head { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .post-head .ring { width: 38px; height: 38px; padding: 2px; }
  .post-head .ring .inner { font-size: 16px; border-width: 2px; }
  .post-head b { font-weight: 600; }
  .post-head .time { color: var(--muted); }
  .post-head .more { margin-left: auto; padding: 4px; }
  .media {
    position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 4px; overflow: hidden;
    display: grid; place-items: center; user-select: none; cursor: pointer;
    border: 1px solid var(--line);
  }
  .media .art { font-size: clamp(90px, 22vw, 150px); filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); }
  .burst {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    opacity: 0; transform: scale(.4);
  }
  .burst.go { animation: pop .8s ease-out; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.4); }
    25% { opacity: 1; transform: scale(1.15); }
    50% { transform: scale(.95); }
    100% { opacity: 0; transform: scale(1); }
  }
  .actions { display: flex; align-items: center; gap: 4px; padding: 8px 0 4px; margin-left: -8px; }
  .actions button { padding: 8px; border-radius: 8px; }
  .actions button:hover { opacity: .6; }
  .actions .save { margin-left: auto; margin-right: -8px; }
  .like.on svg { fill: var(--red); stroke: var(--red); animation: beat .35s ease; }
  @keyframes beat { 50% { transform: scale(1.3); } }
  .save.on svg { fill: var(--text); }
  .likes { font-weight: 600; margin-bottom: 6px; }
  .caption b { font-weight: 600; margin-right: 4px; }
  .caption .tag { color: #00376b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .caption .tag { color: #e0f1ff; } }
  :root[data-theme="dark"] .caption .tag { color: #e0f1ff; }
  .viewall { color: var(--muted); margin: 6px 0 4px; display: block; }
  .comments p { margin-bottom: 2px; }
  .comments p b { font-weight: 600; margin-right: 4px; }
  .add { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .add input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; padding: 4px 0; }
  .add input::placeholder { color: var(--muted); }
  .add button { color: var(--blue); font-weight: 600; opacity: .5; }
  .add button.ready { opacity: 1; }

  /* Mobile bottom bar */
  .topbar, .bottombar { display: none; }

  @media (max-width: 1100px) {
    .side { display: none; }
  }
  @media (max-width: 900px) {
    .sidebar { width: 72px; padding: 8px; align-items: center; }
    .sidebar .label { display: none; }
    .logo { font-size: 0; padding: 24px 0; }
    .logo::before { content: "IG"; font-size: 22px; font-family: inherit; font-weight: 800; }
    .nav a, .nav button { justify-content: center; padding: 12px; }
    .main { margin-left: 72px; }
  }
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .main { margin: 0; padding: 0 0 calc(64px + env(safe-area-inset-bottom, 0px)); }
    .feed { max-width: 100%; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 5; background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 6px 16px; padding-top: calc(6px + env(safe-area-inset-top, 0px));
    }
    .topbar .logo { font-size: 26px; padding: 6px 0; }
    .topbar .logo::before { content: none; }
    .topbar .icons { display: flex; gap: 8px; }
    .topbar .icons button { padding: 6px; }
    .stories { padding: 12px 12px 12px; }
    .post { padding: 0 0 12px; }
    .post-head, .actions, .likes, .caption, .viewall, .comments, .add { padding-left: 12px; padding-right: 12px; }
    .actions { margin-left: 0; padding-left: 4px; padding-right: 4px; }
    .actions .save { margin-right: 0; }
    .media { border-radius: 0; border-left: 0; border-right: 0; }
    .bottombar {
      display: flex; justify-content: space-around; align-items: center;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      background: var(--bg); border-top: 1px solid var(--line);
      padding: 8px 0; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .bottombar button { padding: 6px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .burst.go, .like.on svg { animation: none; }
  }
</style>
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7.005Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-explore" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 8-2.2 5.8L8 16l2.2-5.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>

    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 3 9.2 10.7M22 3l-7 18-5.8-10.3L22 3ZM9.2 10.7 2 9.5 22 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.3A4.7 4.7 0 0 1 12 7.3a4.7 4.7 0 0 1 8.5 2.4C20.5 15.8 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-comment" viewBox="0 0 24 24"><path d="M20.66 17.67A9.5 9.5 0 1 0 6.33 20.4L3 21.5l1.2-3.2a9.46 9.46 0 0 0 16.46-.63Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- Desktop sidebar -->
  <aside class="sidebar">
    <a href="#" class="logo" aria-label="Instagram">Instagram</a>
    <nav class="nav" aria-label="Main">
      <a href="#" class="active"><svg width="24" height="24"><use href="#i-home"/></svg><span class="label">Home</span></a>
      <a href="#"><svg width="24" height="24"><use href="#i-search"/></svg><span class="label">Search</span></a>
      <a href="#"><svg width="24" height="24"><use href="#i-explore"/></svg><span class="label">Explore</span></a>
      <a href="#"><svg width="24" height="24"><use href="#i-reels"/></svg><span class="label">Reels</span></a>
      <a href="#"><svg width="24" height="24"><use href="#i-send"/></svg><span class="label">Messages</span></a>
      <a href="#"><svg width="24" height="24"><use href="#i-heart"/></svg><span class="label">Notifications</span></a>
      <a href="#"><svg width="24" height="24"><use href="#i-plus"/></svg><span class="label">Create</span></a>
      <a href="#"><span class="avatar-sm"></span><span class="label">Profile</span></a>
    </nav>
    <button id="themeBtn" class="nav-btn" style="display:flex;align-items:center;gap:16px;padding:12px;border-radius:8px;font-size:16px;width:100%">
      <svg width="24" height="24"><use href="#i-moon"/></svg><span class="label">Switch appearance</span>
    </button>
  </aside>

  <!-- Mobile top bar -->
  <main class="main">
    <div class="feed">
      <div class="topbar">
        <a href="#" class="logo">Instagram</a>
        <div class="icons">
          <button aria-label="Notifications"><svg width="24" height="24"><use href="#i-heart"/></svg></button>
          <button aria-label="Messages"><svg width="24" height="24"><use href="#i-send"/></svg></button>
        </div>
      </div>

      <div class="stories" id="stories" aria-label="Stories"></div>
      <div id="posts"></div>
    </div>

    <aside class="side">
      <div class="me">
        <div class="pic">🙂</div>
        <div><b>your_username</b><span>Your Name</span></div>
        <button class="switch">Switch</button>
      </div>
      <h3>Suggested for you <a href="#">See all</a></h3>
      <div id="suggestions"></div>
      <footer>
        About · Help · Press · API · Jobs · Privacy · Terms · Locations · Language<br>
        © 2026 INSTAGRAM CLONE (UI DEMO)
      </footer>
    </aside>
  </main>

  <!-- Mobile bottom bar -->
  <nav class="bottombar" aria-label="Main">
    <button aria-label="Home"><svg width="26" height="26"><use href="#i-home"/></svg></button>
    <button aria-label="Search"><svg width="26" height="26"><use href="#i-search"/></svg></button>
    <button aria-label="Create"><svg width="26" height="26"><use href="#i-plus"/></svg></button>
    <button aria-label="Reels"><svg width="26" height="26"><use href="#i-reels"/></svg></button>
    <button aria-label="Profile"><span class="avatar-sm" style="width:26px;height:26px"></span></button>
  </nav>
</div>

<script>
  // ---------- Demo data (swap emoji/gradients for <img src="..."> when you have real photos) ----------
  const people = [
    { user: 'maya.travels',  emoji: '🏔️', bg: 'linear-gradient(135deg,#89f7fe,#66a6ff)' },
    { user: 'chef.arjun',    emoji: '🍜', bg: 'linear-gradient(135deg,#f6d365,#fda085)' },
    { user: 'pixel.studio',  emoji: '🎨', bg: 'linear-gradient(135deg,#a18cd1,#fbc2eb)' },
    { user: 'fit.with.sara', emoji: '🏃', bg: 'linear-gradient(135deg,#84fab0,#8fd3f4)' },
    { user: 'tiny.paws',     emoji: '🐶', bg: 'linear-gradient(135deg,#ffecd2,#fcb69f)' },
    { user: 'night.owl',     emoji: '🌙', bg: 'linear-gradient(135deg,#667eea,#764ba2)' },
    { user: 'beans.daily',   emoji: '☕', bg: 'linear-gradient(135deg,#d4a373,#8d6e4c)' },
  ];

  const posts = [
    { p: 0, art: '🏔️', bg: 'linear-gradient(160deg,#a1c4fd,#c2ffd8)', likes: 12483, time: '2h',
      cap: 'Sunrise above the clouds. Worth every step of the climb.', tags: '#hiking #mountains #sunrise',
      comments: [['sam_k','This view!! 😍'],['dev.rao','Where is this?']], n: 214 },
    { p: 1, art: '🍜', bg: 'linear-gradient(160deg,#fddb92,#d1fdff)', likes: 3921, time: '5h',
      cap: 'Spicy miso ramen, 12-hour broth. Recipe in my story highlights.', tags: '#ramen #homecooking #foodie',
      comments: [['hungry.hannah','Making this tonight'],['leo.m','Save me a bowl']], n: 87 },
    { p: 2, art: '🎨', bg: 'linear-gradient(160deg,#e0c3fc,#8ec5fc)', likes: 8120, time: '8h',
      cap: 'New series finished. Gouache on paper, 30 × 40 cm.', tags: '#art #gouache #illustration',
      comments: [['ink.and.co','The colors 🔥']], n: 132 },
    { p: 4, art: '🐶', bg: 'linear-gradient(160deg,#ffeaa7,#fab1a0)', likes: 25310, time: '1d',
      cap: 'Mochi has decided this is her sunbeam now.', tags: '#dogsofinstagram #goldenretriever',
      comments: [['vet.nina','Peak happiness'],['jo_',"I can't handle this 🥹"]], n: 640 },
  ];

  const fmt = n => n.toLocaleString('en-US');
  const icon = (id, s = 24) => `<svg width="${s}" height="${s}"><use href="#i-${id}"/></svg>`;
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- Stories ----------
  const storiesEl = document.getElementById('stories');
  storiesEl.innerHTML =
    `<div class="story"><div class="ring seen"><div class="inner" style="background:var(--chip)">＋</div></div><small>Your story</small></div>` +
    people.map(pp => `
      <button class="story" data-user="${pp.user}">
        <div class="ring"><div class="inner" style="background:${pp.bg}">${pp.emoji}</div></div>
        <small>${pp.user}</small>
      </button>`).join('');
  storiesEl.addEventListener('click', e => {
    const s = e.target.closest('.story[data-user]');
    if (s) s.querySelector('.ring').classList.add('seen');
  });

  // ---------- Posts ----------
  const postsEl = document.getElementById('posts');
  postsEl.innerHTML = posts.map((po, i) => {
    const pp = people[po.p];
    return `
    <article class="post" data-i="${i}">
      <div class="post-head">
        <div class="ring"><div class="inner" style="background:${pp.bg}">${pp.emoji}</div></div>
        <div><b>${pp.user}</b> <span class="time">• ${po.time}</span></div>
        <button class="more" aria-label="More options">${icon('dots')}</button>
      </div>
      <div class="media" style="background:${po.bg}" tabindex="0" aria-label="Double-tap to like">
        <span class="art">${po.art}</span>
        <div class="burst"><svg width="96" height="96" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-8.5-5.2-8.5-11.3A4.7 4.7 0 0 1 12 7.3a4.7 4.7 0 0 1 8.5 2.4C20.5 15.8 12 21 12 21Z"/></svg></div>
      </div>
      <div class="actions">
        <button class="like" aria-label="Like" aria-pressed="false">${icon('heart')}</button>
        <button class="cmt" aria-label="Comment">${icon('comment')}</button>
        <button aria-label="Share">${icon('send')}</button>
        <button class="save" aria-label="Save" aria-pressed="false">${icon('bookmark')}</button>
      </div>
      <div class="likes"><span class="count">${fmt(po.likes)}</span> likes</div>
      <div class="caption"><b>${pp.user}</b>${esc(po.cap)} <span class="tag">${esc(po.tags)}</span></div>
      <a href="#" class="viewall">View all ${po.n} comments</a>
      <div class="comments">${po.comments.map(c => `<p><b>${esc(c[0])}</b>${esc(c[1])}</p>`).join('')}</div>
      <div class="add">
        <input type="text" placeholder="Add a comment…" aria-label="Add a comment">
        <button class="send">Post</button>
      </div>
    </article>`;
  }).join('');

  function setLike(post, on) {
    const i = +post.dataset.i;
    const btn = post.querySelector('.like');
    const liked = btn.classList.contains('on');
    if (on === liked) return;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on);
    posts[i].likes += on ? 1 : -1;
    post.querySelector('.count').textContent = fmt(posts[i].likes);
  }

  postsEl.addEventListener('click', e => {
    const post = e.target.closest('.post');
    if (!post) return;
    if (e.target.closest('.like')) setLike(post, !post.querySelector('.like').classList.contains('on'));
    if (e.target.closest('.save')) {
      const b = post.querySelector('.save');
      const on = b.classList.toggle('on'); b.setAttribute('aria-pressed', on);
    }
    if (e.target.closest('.cmt')) post.querySelector('.add input').focus();
    if (e.target.closest('.send')) postComment(post);
  });

  // Double-click / double-tap to like
  postsEl.addEventListener('dblclick', e => {
    const media = e.target.closest('.media');
    if (!media) return;
    const post = media.closest('.post');
    setLike(post, true);
    const burst = media.querySelector('.burst');
    burst.classList.remove('go'); void burst.offsetWidth; burst.classList.add('go');
  });

  // Comments
  postsEl.addEventListener('input', e => {
    if (e.target.matches('.add input')) {
      e.target.closest('.add').querySelector('.send').classList.toggle('ready', e.target.value.trim() !== '');
    }
  });
  postsEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('.add input')) postComment(e.target.closest('.post'));
  });
  function postComment(post) {
    const input = post.querySelector('.add input');
    const text = input.value.trim();
    if (!text) return;
    post.querySelector('.comments').insertAdjacentHTML('beforeend', `<p><b>your_username</b>${esc(text)}</p>`);
    input.value = '';
    post.querySelector('.send').classList.remove('ready');
  }

  // ---------- Suggestions ----------
  const sugEl = document.getElementById('suggestions');
  sugEl.innerHTML = [people[3], people[5], people[6], people[2], people[0]].map(pp => `
    <div class="sug">
      <div class="pic" style="background:${pp.bg}">${pp.emoji}</div>
      <div class="who"><b>${pp.user}</b><span>Suggested for you</span></div>
      <button class="follow">Follow</button>
    </div>`).join('');
  sugEl.addEventListener('click', e => {
    const b = e.target.closest('.follow');
    if (!b) return;
    const on = b.classList.toggle('on');
    b.textContent = on ? 'Following' : 'Follow';
  });

  // ---------- Theme toggle ----------
  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme
      ? root.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });
</script>
</body>
</html>
